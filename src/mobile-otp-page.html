<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Verification | Nour Beauty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/css/output.css" />
    <link rel="stylesheet" href="./assets/css/style.min.css" />
</head>

<body>

    <main class="otp-page-container">
        <div class="otp-layout-wrapper">
            <div class="row g-0 otp-row align-items-center">

                <!-- Left Column: Illustration (hidden below lg) -->
                <div class="col-12 col-lg-6 d-none d-lg-flex otp-illustration-col">
                    <div class="otp-illustration-inner text-center">
                        <div class="otp-illustration-card">
                            <img src="./assets/img/undraw_two-factor-authentication_ofho.svg"
                                alt="Secure authentication illustration" class="otp-illustration-img">
                        </div>
                        <h2 class="otp-illustration-title mt-3">Secure Authentication</h2>
                        <p class="otp-illustration-text">
                            We've sent a unique 5-digit code to your registered mobile device.
                        </p>
                    </div>
                </div>

                <!-- Right Column: OTP Form -->
                <div class="col-12 col-lg-6 d-flex otp-form-col">
                    <div class="otp-form-wrapper">

                        <!-- Card -->
                        <div class="otp-card">

                            <!-- Heading -->
                            <div class="otp-heading-block">
                                <div class="otp-icon-circle">
                                    <i class="fa-solid fa-shield-halved"></i>
                                </div>
                                <h1 class="otp-title">OTP Verification</h1>
                                <p class="otp-subtitle">
                                    Enter OTP Code sent to
                                    <strong class="otp-phone-number">+88017*******42</strong>
                                </p>
                            </div>

                            <!-- OTP Inputs -->
                            <form id="otpForm" class="otp-inputs-row" autocomplete="off">
                                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" id="otp1"
                                    aria-label="Digit 1">
                                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" id="otp2"
                                    aria-label="Digit 2">
                                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" id="otp3"
                                    aria-label="Digit 3">
                                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" id="otp4"
                                    aria-label="Digit 4">
                                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" id="otp5"
                                    aria-label="Digit 5">
                            </form>

                            <!-- Resend -->
                            <div class="otp-resend-block">
                                <p class="otp-resend-text">Didn't receive OTP code?</p>
                                <div class="otp-resend-row">
                                    <button type="button" class="otp-resend-btn" id="resendBtn" disabled>
                                        Resend Code
                                    </button>
                                    <span class="otp-timer" id="otpTimer">
                                        <i class="fa-regular fa-clock me-1"></i>
                                        <span id="timerDisplay">01:00</span>
                                    </span>
                                </div>
                            </div>

                            <!-- Verify Button -->
                            <button type="submit" form="otpForm" class="otp-verify-btn" id="verifyBtn">
                                <span class="otp-verify-text">Verify &amp; Proceed</span>
                                <i class="fa-solid fa-arrow-right-long ms-2"></i>
                            </button>

                            <!-- Security note with top border -->
                            <div class="otp-security-divider">
                                <p class="otp-security-note">
                                    <i class="fa-solid fa-lock me-1"></i>
                                    Secure SSL Encryption
                                </p>
                            </div>

                        </div>
                        <!-- /otp-card -->

                    </div>
                </div>
                <!-- /otp-form-col -->

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── OTP digit auto-tab ──────────────────────────────────────────
        const inputs = document.querySelectorAll('.otp-digit-input');

        inputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                e.target.value = val;
                if (val && idx < inputs.length - 1) {
                    inputs[idx + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && idx > 0) {
                    inputs[idx - 1].focus();
                }
                if (e.key === 'ArrowLeft' && idx > 0) inputs[idx - 1].focus();
                if (e.key === 'ArrowRight' && idx < inputs.length - 1) inputs[idx + 1].focus();
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                [...pasted].slice(0, inputs.length).forEach((char, i) => {
                    if (inputs[i]) inputs[i].value = char;
                });
                const nextEmpty = [...inputs].findIndex(i => !i.value);
                if (nextEmpty !== -1) inputs[nextEmpty].focus();
                else inputs[inputs.length - 1].focus();
            });
        });

        // ── Countdown timer ─────────────────────────────────────────────
        let timeLeft = 60;
        const timerDisplay = document.getElementById('timerDisplay');
        const resendBtn = document.getElementById('resendBtn');
        const timerEl = document.getElementById('otpTimer');

        function startTimer() {
            timeLeft = 60;
            resendBtn.disabled = true;
            timerEl.style.display = 'inline-flex';

            const interval = setInterval(() => {
                timeLeft--;
                const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const secs = String(timeLeft % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    resendBtn.disabled = false;
                    timerEl.style.display = 'none';
                }
            }, 1000);
        }

        startTimer();

        resendBtn.addEventListener('click', () => {
            inputs.forEach(i => i.value = '');
            inputs[0].focus();
            startTimer();
        });

        // ── Form submit ─────────────────────────────────────────────────
        document.getElementById('otpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = [...inputs].map(i => i.value).join('');
            if (code.length < inputs.length) {
                inputs.forEach(i => i.classList.add('otp-digit-input--error'));
                setTimeout(() => inputs.forEach(i => i.classList.remove('otp-digit-input--error')), 600);
                return;
            }
            // Success state
            const btn = document.getElementById('verifyBtn');
            btn.classList.add('otp-verify-btn--success');
            btn.innerHTML = '<i class="fa-solid fa-check me-2"></i> Verified!';
        });
    </script>
</body>

</html>
